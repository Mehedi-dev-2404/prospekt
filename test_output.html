<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Lane Dental Studio | Dentist in E1 6SE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #2563EB;
    --primary-dark: #1d4ed8;
    --primary-light: #dbeafe;
    --primary-pale: #eff6ff;
    --accent: #60a5fa;
    --text-dark: #0f172a;
    --text-mid: #334155;
    --text-light: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --bg-light: #f8fafc;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
    background: var(--white);
    line-height: 1.6;
  }

  /* TOP DEMO BANNER */
  .demo-banner {
    background: #0f172a;
    color: #94a3b8;
    text-align: center;
    font-size: 0.75rem;
    padding: 8px 16px;
    letter-spacing: 0.02em;
  }

  .demo-banner span {
    color: var(--accent);
    font-weight: 500;
  }

  /* NAVIGATION */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 12px rgba(37, 99, 235, 0.07);
  }

  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-logo-icon svg {
    width: 22px;
    height: 22px;
    fill: white;
  }

  .nav-logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.2;
  }

  .nav-logo-text small {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-mid);
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: var(--primary);
  }

  .nav-cta {
    background: var(--primary);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 8px;
    transition: background 0.2s !important;
  }

  .nav-cta:hover {
    background: var(--primary-dark) !important;
    color: var(--white) !important;
  }

  @media (max-width: 700px) {
    .nav-links {
      display: none;
    }
  }

  /* HERO SECTION */
  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, var(--primary) 100%);
    position: relative;
    overflow: hidden;
    padding: 100px 24px 80px;
    text-align: center;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -120px;
    right: -120px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(96,165,250,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    padding: 6px 18px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .hero-badge::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.15;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }

  .hero-tagline {
    font-size: 1.15rem;
    color: rgba(255,255,255,0.75);
    margin-bottom: 48px;
    font-weight: 300;
    letter-spacing: 0.02em;
    position: relative;
    z-index: 1;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  .btn-primary {
    background: var(--white);
    color: var(--primary);
    padding: 14px 32px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  }

  .btn-outline {
    border: 2px solid rgba(255,255,255,0.4);
    color: var(--white);
    padding: 14px 32px;
    border-radius: 10px;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.7);
  }

  /* TRUST STRIP */
  .trust-strip {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px;
  }

  .trust-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 40px;
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 10px
