<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>East End Cycle Repair | Professional Bicycle Repair & Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #2C3E50;
    --primary-light: #3d5166;
    --primary-dark: #1a252f;
    --accent: #E74C3C;
    --accent-light: #ec6b5e;
    --gold: #F39C12;
    --light: #f8f9fa;
    --light-gray: #e9ecef;
    --mid-gray: #6c757d;
    --white: #ffffff;
    --text-dark: #1a1a2e;
    --text-body: #444;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-body);
    background: var(--white);
    line-height: 1.6;
  }

  /* ─── DEMO BANNER ─── */
  .demo-banner {
    background: var(--primary-dark);
    color: rgba(255,255,255,0.75);
    text-align: center;
    padding: 8px 16px;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    font-weight: 500;
  }

  .demo-banner span {
    color: var(--gold);
    font-weight: 600;
  }

  /* ─── NAVIGATION ─── */
  nav {
    background: var(--primary);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.25);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 40px;
    height: 40px;
    position: relative;
    flex-shrink: 0;
  }

  /* CSS Bicycle Wheel */
  .wheel-svg {
    width: 40px;
    height: 40px;
  }

  .nav-logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-logo-text strong {
    color: var(--white);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .nav-logo-text span {
    color: var(--gold);
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 6px;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
  }

  .nav-links a:hover {
    color: var(--white);
    background: rgba(255,255,255,0.1);
  }

  .nav-cta {
    background: var(--accent) !important;
    color: var(--white) !important;
    border-radius: 8px !important;
    padding: 9px 18px !important;
    font-weight: 600 !important;
  }

  .nav-cta:hover {
    background: var(--accent-light) !important;
    transform: translateY(-1px);
  }

  /* ─── HERO ─── */
  .hero {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 80px 24px;
  }

  /* Decorative background shapes */
  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.05);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.04);
    pointer-events: none;
  }

  .hero-bg-circle-1 {
    position: absolute;
    bottom: -150px;
    left: -150px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(231,76,60,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-bg-circle-2 {
    position: absolute;
    top: 50%;
    right: 5%;
    transform: translateY(-50%);
    width: 320px;
    height: 320px;
    pointer-events: none;
  }

  /* CSS Bicycle illustration */
  .hero-bike {
    position: relative;
    width: 280px;
    height: 180px;
    opacity: 0.12;
  }

  .hero-bike .wheel {
    position: absolute;
    border-radius: 50%;
    border: 14px solid rgba(255,255,255,0.6);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
  }

  .hero-bike .wheel-left {
    width: 120px;
    height: 120px;
    bottom: 0;
    left: 0;
  }

  .hero-bike .wheel-right {
    width: 120px;
    height: 120px;
    bottom: 0;
    right: 0;
  }

  .hero-bike .frame {
    position: absolute;
    bottom: 60px;
    left: 60px;
    width: 160px;
    height: 80px;
    border-left: 12px solid rgba(255,255,255,0.6);
    border-bottom: 12px solid rgba(255,255,255,0.6);
    transform: skewX(-20deg);
    border-radius: 0 0 0 8px;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .hero-text {
    color: var(--white);
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(243,156,18,0.15);
    border: 1px solid rgba(243,156,18,0.4);
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
  }

  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 20px;
    color: var(--white);
  }

  .hero h1 em {
    font-style: normal;
    color: var(--gold);
  }

  .hero-tagline {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: rgba(255,255),255,0.85);
    margin-bottom: 30px;
  }
